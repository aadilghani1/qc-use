[project]
name = "qc-use"
version = "0.4.0"
description = "Critical-path QA in plain words. Powered by TypeSafe Jev."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Aadil Ghani" }]
dependencies = [
    "browser-harness==0.1.13",
    "httpx[http2]>=0.28,<1",
    "pillow>=11,<13",
    "pydantic>=2.11,<3",
    "pyyaml>=6,<7",
]
keywords = ["qa", "e2e-testing", "browser-automation", "ai-agents", "typesafe", "jev", "critical-path"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/aadilghani1/qc-use"
Documentation = "https://github.com/aadilghani1/qc-use/tree/main/docs"
Source = "https://github.com/aadilghani1/qc-use"
Issues = "https://github.com/aadilghani1/qc-use/issues"
Releases = "https://github.com/aadilghani1/qc-use/releases"

[project.scripts]
qc-use = "qc_use.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qc_use"]
exclude = ["qc_use/**/AGENTS.md", "qc_use/**/CLAUDE.md"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4,<5",
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, comprehensions, ruff, pie
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PIE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["qc_use"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
ignore_missing_imports = true
