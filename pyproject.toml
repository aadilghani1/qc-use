[project]
name = "qc-use"
version = "0.1.0"
description = "Critical-path QA in plain words. Powered by TypeSafe Jev."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "browser-harness==0.1.13",
    "httpx[http2]>=0.28,<1",
    "pillow>=11,<13",
    "pydantic>=2.11,<3",
    "pyyaml>=6,<7",
]
keywords = ["qa", "e2e-testing", "browser-automation", "ai-agents", "typesafe", "jev", "critical-path"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/aadilghani1/qc-use"
Issues = "https://github.com/aadilghani1/qc-use/issues"

[project.scripts]
qc-use = "qc_use.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qc_use"]
exclude = ["qc_use/**/AGENTS.md", "qc_use/**/CLAUDE.md"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
